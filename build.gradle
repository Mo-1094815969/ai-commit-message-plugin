plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'com.github.aicommit'
version = '1.0.3'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}

intellij {
    version = '2022.1.4'
    type = 'IC'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

patchPluginXml {
    sinceBuild = '221'
    untilBuild = ''
    changeNotes = '''
        <p><b>English</b></p>
        <ul>
            <li>Kept the Commit Message field unchanged when generation starts; generated text is written only after real AI content arrives.</li>
            <li>Restored the native loading animation while generating, with a matching gray stop icon shown on hover.</li>
            <li>Clicking the running action now stops the current stream, leaves existing text untouched, and suppresses failure notifications for user-initiated cancellation.</li>
        </ul>
        <p><b>中文</b></p>
        <ul>
            <li>开始生成时不再改写 Commit Message 输入框，只有收到真实 AI 内容后才开始写入。</li>
            <li>生成中恢复 IDE 原生加载动画，鼠标悬停时展示同色系灰色停止图标。</li>
            <li>点击运行中的按钮会停止当前流式输出，保留已有文本，并且用户主动取消不会弹出失败通知。</li>
        </ul>
    '''
}

tasks.named('downloadZipSigner') {
    version.set('0.1.43')
}

tasks.matching { it.name.startsWith('buildSearchableOptions') }.configureEach {
    enabled = false
}

tasks.named('buildSearchableOptions') {
    enabled = false
}

publishPlugin {
    token = System.getenv('JETBRAINS_MARKETPLACE_TOKEN') ?: findProperty('jetbrains.marketplace.token') ?: ''
}
