plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'com.github.aicommit'
version = '1.0.3-fix'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}

intellij {
    version = '2022.1.4'
    type = 'IC'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

patchPluginXml {
    sinceBuild = '221'
    untilBuild = ''
    changeNotes = '''
        <p><b>English</b></p>
        <ul>
            <li>Fixed restoring local Codex settings when the built-in provider is used or the provider is declared by the selected profile.</li>
            <li>Local and custom model IDs now appear directly in an editable model dropdown and are saved correctly even before the field loses focus.</li>
            <li>Removed the dynamically shown custom-model row and kept settings action buttons compact and left-aligned to prevent layout shifts.</li>
        </ul>
        <p><b>中文</b></p>
        <ul>
            <li>修复 Codex 使用内置提供方或在选中 profile 中声明提供方时，恢复默认无法正确读取本地配置的问题。</li>
            <li>本地及自定义模型 ID 直接显示在可编辑模型下拉框中，输入框未失焦时也能正确保存当前值。</li>
            <li>移除动态显隐的自定义模型行，并让设置页操作按钮保持紧凑左对齐，避免恢复配置后布局跳动。</li>
        </ul>
    '''
}

tasks.named('downloadZipSigner') {
    version.set('0.1.43')
}

tasks.matching { it.name.startsWith('buildSearchableOptions') }.configureEach {
    enabled = false
}

tasks.named('buildSearchableOptions') {
    enabled = false
}

publishPlugin {
    token = System.getenv('JETBRAINS_MARKETPLACE_TOKEN') ?: findProperty('jetbrains.marketplace.token') ?: ''
}
